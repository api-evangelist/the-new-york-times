naftiko: 1.0.0-alpha2
info:
  label: The New York Times Archive API — Archive
  description: 'The New York Times Archive API — Archive. 1 operations. Lead operation: The New York Times Archive API. Self-contained
    Naftiko capability covering one The New York Times business surface.'
  tags:
  - The New York Times
  - Archive
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THE_NEW_YORK_TIMES_API_KEY: THE_NEW_YORK_TIMES_API_KEY
capability:
  consumes:
  - type: http
    namespace: new-york-times-archive-archive
    baseUri: http://api.nytimes.com/svc/archive/v1
    description: The New York Times Archive API — Archive business capability. Self-contained, no shared references.
    resources:
    - name: year-month}.json
      path: /{year}/{month}.json
      operations:
      - name: get
        method: GET
        description: The New York Times Archive API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: year
          in: path
          type: integer
          description: The year (e.g. 2016).
          required: true
        - name: month
          in: path
          type: integer
          description: The month number (e.g. 1 for January).
          required: true
    authentication:
      type: apikey
      key: api-key
      value: '{{env.THE_NEW_YORK_TIMES_API_KEY}}'
      placement: query
  exposes:
  - type: rest
    namespace: new-york-times-archive-archive-rest
    port: 8080
    description: REST adapter for The New York Times Archive API — Archive. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/{year}/month-json
      name: year-month-json
      description: REST surface for year-month}.json.
      operations:
      - method: GET
        name: get
        description: The New York Times Archive API
        call: new-york-times-archive-archive.get
        with:
          year: rest.year
          month: rest.month
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: new-york-times-archive-archive-mcp
    port: 9090
    transport: http
    description: MCP adapter for The New York Times Archive API — Archive. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: new-york-times-archive-api
      description: The New York Times Archive API
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: new-york-times-archive-archive.get
      with:
        year: tools.year
        month: tools.month
      outputParameters:
      - type: object
        mapping: $.
