    resources:
    - path: /v1/timestags
      name: timestags
      description: REST surface for timestags.
      operations:
      - method: GET
        name: get
        description: get
        call: new-york-times-times-tags-timestags.get
        with:
          query: rest.query
          filter: rest.filter
          max: rest.max
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: new-york-times-times-tags-timestags-mcp
    port: 9090
    transport: http
    description: MCP adapter for The New York Times TimesTags API — Timestags. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get
      description: get
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: new-york-times-times-tags-timestags.get
      with:
        query: tools.query
        filter: tools.filter
        max: tools.max
      outputParameters:
      - type: object
        mapping: $.
