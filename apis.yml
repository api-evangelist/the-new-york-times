name: The New York Times
description: The New York Times is one of the world's most respected news organizations, providing comprehensive journalism
  across politics, culture, business, science, health, and the arts since 1851. The NYT Developer Network exposes a suite
  of RESTful APIs enabling developers to search and access NYT articles, best-seller book lists, movie reviews, semantic metadata,
  top stories, and popular content. All APIs require an API key obtained from the NYT Developer Portal.
